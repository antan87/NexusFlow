<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="cs-ext-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#182030" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="cs-ext-rim" x1="30" y1="20" x2="170" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="cs-ext-white" x1="46" y1="36" x2="90" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="cs-ext-red" x1="90" y1="36" x2="154" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5A6E" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <clipPath id="cs-ext-c-clip">
      <path d="M68 36 L132 36 L154 58 L154 78 L122 78 L122 66 L80 66 L80 134 L122 134 L122 122 L154 122 L154 142 L132 164 L68 164 L46 142 L46 58 Z" />
    </clipPath>
  </defs>

  <!-- Dark Slate Background Plate -->
  <rect width="200" height="200" rx="44" fill="url(#cs-ext-bg)" />
  <rect x="1" y="1" width="198" height="198" rx="43" stroke="url(#cs-ext-rim)" stroke-width="1.5" />

  <!-- Dual-Tone Body with Chamfered Internal Seams -->
  <g clip-path="url(#cs-ext-c-clip)">
    <!-- Left Spine: Alpine White Gradient -->
    <path d="M46 36 L90 36 L90 164 L46 164 Z" fill="url(#cs-ext-white)" />
    <!-- Right Power Wing: Crimson Gradient -->
    <path d="M90 36 L154 36 L154 164 L90 164 Z" fill="url(#cs-ext-red)" />
    <!-- Internal Bevel Highlight Line -->
    <line x1="90" y1="36" x2="90" y2="164" stroke="#080C14" stroke-width="2" />
    <line x1="88" y1="36" x2="88" y2="164" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1" />
  </g>

  <!-- 3 Precision Razor Slashes with Depth Shadow -->
  <!-- Slash 1: Upper -->
  <path d="M88 28 L168 108 L158 118 L78 38 Z" fill="#080C14" />
  <path d="M88 28 L168 108" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
  <!-- Slash 2: Center Core -->
  <path d="M58 58 L138 138 L128 148 L48 68 Z" fill="#080C14" />
  <path d="M58 58 L138 138" stroke="#FF5A6E" stroke-opacity="0.3" stroke-width="1" />
  <!-- Slash 3: Lower -->
  <path d="M28 88 L108 168 L98 178 L18 98 Z" fill="#080C14" />

  <!-- Tapered Speed Needle Trails -->
  <path d="M94 22 L128 -12" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <path d="M154 94 L190 58" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
  <path d="M44 72 L10 106" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
  <path d="M124 124 L160 88" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
  <path d="M24 102 L-10 136" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" />
</svg>