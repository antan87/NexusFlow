version: 2
updates:
  # 1. Root npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "antan87"
    groups:
      root-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 2. GUI npm dependencies
  - package-ecosystem: "npm"
    directory: "/gui"
    schedule:
      interval: "daily"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "antan87"
    groups:
      gui-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 3. VS Code Extension npm dependencies
  - package-ecosystem: "npm"
    directory: "/extension"
    schedule:
      interval: "daily"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "antan87"
    groups:
      extension-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 4. Desktop npm dependencies
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "daily"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "antan87"
    groups:
      desktop-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 5. GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "antan87"
    groups:
      github-actions:
        patterns:
          - "*"
