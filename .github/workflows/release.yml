name: Release

# One deliberate, coordinated release for every channel (npm + VS Code extension
# + desktop installer), dispatched against protected default-branch workflow code:
#
#   npm version minor --no-git-tag-version  # bump + sync in a reviewed PR
#   gh api repos/OWNER/REPO/dispatches \
#     -f event_type=release -F client_payload[version]=X.Y.Z
#
# The repository_dispatch event always loads this workflow from the default
# branch. The guard validates the requested version and creates the tag at that
# protected source SHA before any publish job starts.
#
# Prerelease versions (e.g. 1.2.0-rc.1) publish npm under the "next" dist-tag, mark
# the GitHub Release as a prerelease, and skip the Marketplace (which does not
# support semver prerelease suffixes).

on:
  repository_dispatch:
    types: [release]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Gate: protected source, requested version, and synced files must agree ──
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      tag: ${{ steps.resolve.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The release guard must prove the dispatched source belongs to the
          # protected default-branch history before any irreversible publish.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require dispatched source on protected default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Dispatched source $GITHUB_SHA is not on origin/$DEFAULT_BRANCH. Merge through protected CI before releasing."
            exit 1
          fi
          echo "Dispatched source is on protected origin/$DEFAULT_BRANCH history."

      - name: Resolve and validate version
        id: resolve
        env:
          REQUESTED: ${{ github.event.client_payload.version }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          echo "Requested version: $REQUESTED / package.json version: $PKG"
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" != "$PKG" ]; then
            echo "::error::Requested version ($REQUESTED) does not match package.json version ($PKG). Merge a synchronized version bump first."
            exit 1
          fi
          node scripts/sync-version.mjs --check
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "tag=v$PKG" >> "$GITHUB_OUTPUT"
          if [[ "$PKG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create immutable release tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          REMOTE_SHA=$(git ls-remote --refs origin "refs/tags/$TAG" | awk '{print $1}')
          if [ -n "$REMOTE_SHA" ]; then
            if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already exists at $REMOTE_SHA, expected $GITHUB_SHA. Refusing to move it."
              exit 1
            fi
            echo "Tag $TAG already exists at the protected source SHA; continuing idempotently."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

  # ── npm ──────────────────────────────────────────────────────────────────────
  npm:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # npm trusted publishing and provenance
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false

      # Trusted publishing requires npm 11.5.1+ and Node 22.14.0+.
      - run: npm install --global npm@11.5.1

      - run: npm ci
      - run: npm ci --prefix gui
      - run: npm run build

      - name: Publish to npm
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          if npm info "@mrpatronz/nexusflow@$VERSION" version >/dev/null 2>&1; then
            echo "npm already has $VERSION — skipping (idempotent re-run)."
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --tag next
          else
            npm publish
          fi

  # ── VS Code Marketplace ───────────────────────────────────────────────────────
  # Gated behind a repo variable until Azure OIDC (AZURE_CLIENT_ID / AZURE_TENANT_ID)
  # is configured — until then this job is skipped rather than failing the release.
  # To re-enable: set the repo/environment variable VSCODE_PUBLISHING_ENABLED=true.
  vscode:
    needs: guard
    if: needs.guard.outputs.prerelease == 'false' && vars.VSCODE_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Azure OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --prefix extension

      - name: Azure Login (OIDC — no stored PAT)
        id: azure-login
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Skip VS Code Marketplace publish when Azure OIDC is unavailable
        if: steps.azure-login.outcome != 'success'
        run: |
          echo "::warning::Azure OIDC login failed or is not configured; skipping VS Code Marketplace publish for this release."

      - name: Publish to VS Code Marketplace
        if: steps.azure-login.outcome == 'success'
        working-directory: extension
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          PUBLISHED=$(npx vsce show contextspace.contextspace-vscode --json 2>/dev/null \
            | node -e "
                const d=require('fs').readFileSync(0,'utf8');
                try { process.exit(JSON.parse(d).versions?.['$VERSION'] ? 0 : 1); }
                catch { process.exit(1); }
              " && echo "true" || echo "false")
          if [ "$PUBLISHED" = "true" ]; then
            echo "Marketplace already has $VERSION — skipping (idempotent re-run)."
            exit 0
          fi
          npx vsce publish --no-dependencies --azure-credential

  # ── Desktop installers (Windows NSIS + Linux AppImage) ────────────────────────
  desktop:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm ci --prefix gui
      - run: npm ci --prefix desktop
      - run: npm run setup --prefix desktop

      # electron-builder builds the native installer and update metadata. The
      # package script uses --publish never; the GitHub Release job attaches the
      # generated files after both platform jobs complete.
      - name: Build desktop installer and update metadata
        run: npm run build --prefix desktop

      - name: Verify exact desktop artifact and updater metadata
        run: node desktop/scripts/verify-release-assets.mjs --platform ${{ matrix.platform }} --dir desktop/dist

      - name: Stage Windows desktop artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          if (Test-Path desktop/dist/ContextSpaceSetup.exe) {
            Copy-Item desktop/dist/ContextSpaceSetup.exe release-assets/ContextSpaceSetup.exe
          } else {
            Copy-Item desktop/dist/NexusFlowSetup.exe release-assets/NexusFlowSetup.exe
          }
          Copy-Item desktop/dist/latest.yml release-assets/latest.yml
          Get-ChildItem desktop/dist -File -Filter '*.blockmap' -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName release-assets }

      - name: Stage Linux desktop artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find desktop/dist -maxdepth 1 -type f -name '*.AppImage' -exec cp {} release-assets/ \;
          cp desktop/dist/latest-linux.yml release-assets/latest-linux.yml

      - name: Generate installer SHA-256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem release-assets -File -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Generate installer SHA-256 checksum (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for artifact in release-assets/*.AppImage; do
            sha256sum "$artifact" | sed 's#  release-assets/#  #' > "$artifact.sha256"
          done

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: contextspace-desktop-${{ matrix.platform }}
          path: |
            release-assets/*
          if-no-files-found: error

  # ── One GitHub Release for the tag, with every artifact attached ───────────────
  github-release:
    needs: [guard, npm, vscode, desktop]
    # Run even if the Marketplace job was skipped (prereleases) but not if it failed.
    if: always() && needs.npm.result == 'success' && needs.desktop.result == 'success' && (needs.vscode.result == 'success' || needs.vscode.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: contextspace-desktop-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          name: Release v${{ needs.guard.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.guard.outputs.prerelease == 'true' }}
          files: |
            dist/*
