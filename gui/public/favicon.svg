<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="cs-bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111625" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <linearGradient id="cs-rim" x1="20" y1="10" x2="108" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="cs-crimson" x1="45" y1="20" x2="85" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5A6E" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="cs-white" x1="30" y1="20" x2="98" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Plate -->
  <rect width="128" height="128" rx="28" fill="url(#cs-bg)" />
  <rect x="1" y="1" width="126" height="126" rx="27" stroke="url(#cs-rim)" stroke-width="1.5" />

  <!-- 3-Stripes Hexagonal Speed Slashes -->
  <!-- Left Hexagon Contour Bracket (Forms 'C' Enclosure) -->
  <path d="M42 32 L26 42 L26 86 L42 96 L48 92 L34 83 L34 45 L48 36 Z" fill="url(#cs-white)" />

  <!-- Right Hexagon Contour Bracket Corner -->
  <path d="M86 32 L102 42 L102 48 L94 43 L80 34 Z" fill="url(#cs-white)" />
  <path d="M86 96 L102 86 L102 80 L94 85 L80 94 Z" fill="url(#cs-white)" />

  <!-- 3 Dynamic Speed Slashes (Adidas Diagonal Slashes) -->
  <!-- Stripe 1: White Left Slasher -->
  <path d="M52 26 L42 42 L62 82 L72 66 Z" fill="url(#cs-white)" />

  <!-- Stripe 2: Primary Crimson Power Slash (Center) -->
  <path d="M68 22 L56 42 L80 94 L92 74 Z" fill="url(#cs-crimson)" />

  <!-- Stripe 3: White Right Slasher -->
  <path d="M84 38 L76 50 L94 88 L102 76 Z" fill="url(#cs-white)" />
</svg>