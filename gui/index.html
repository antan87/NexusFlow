<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContextSpace Dashboard</title>
    <!-- Fonts are self-hosted (fontsource) via the bundle; no CDN. -->
    <script>
      // Apply the persisted theme before first paint to avoid a light flash.
      (function () {
        try {
          var stored = localStorage.getItem('contextspace-theme') || localStorage.getItem('nexusflow-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
