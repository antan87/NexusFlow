<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContextSpace Dashboard</title>
    <!-- Fonts are self-hosted (fontsource) via the bundle; no CDN. -->
    <script>
      // Apply the persisted theme before first paint to avoid a light flash.
      (function () {
        var stored;
        var palette = 'sunset';
        var validPalettes = ['sunset', 'aurora', 'forest', 'nebula', 'glacier'];
        try {
          stored = localStorage.getItem('contextspace-theme') || localStorage.getItem('nexusflow-theme');
          var storedPalette = localStorage.getItem('contextspace-color-theme');
          if (storedPalette && validPalettes.indexOf(storedPalette) !== -1) {
            palette = storedPalette;
          }
        } catch (e) { /* Use system appearance when storage is unavailable. */ }
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.colorTheme = palette;
        var iconHref = palette === 'sunset' ? '/favicon.svg' : '/favicon-' + palette + '.svg';
        var link = document.querySelector('link[rel="icon"]');
        if (link) link.href = iconHref;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
